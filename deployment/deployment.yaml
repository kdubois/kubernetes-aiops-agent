apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-agent
  labels:
    app: kubernetes-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-agent
  template:
    metadata:
      labels:
        app: kubernetes-agent
    spec:
      serviceAccountName: kubernetes-agent
      containers:
        - name: agent
          image: ghcr.io/kdubois/kubernetes-agent:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: QUARKUS_PROFILE
              value: prod
            # Analysis model (any OpenAI-compatible endpoint)
            - name: ANALYSIS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent
                  key: analysis_api_key
            - name: ANALYSIS_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent
                  key: analysis_base_url
                  optional: true
            - name: ANALYSIS_MODEL
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent
                  key: analysis_model
                  optional: true
            # Second-opinion tier for the escalation (optional, empty disables it)
            - name: ANALYSIS_SECOND_OPINION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent
                  key: analysis_second_opinion_api_key
                  optional: true
            - name: ANALYSIS_SECOND_OPINION_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent
                  key: analysis_second_opinion_base_url
                  optional: true
            - name: ANALYSIS_SECOND_OPINION_MODEL
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent
                  key: analysis_second_opinion_model
                  optional: true
            # Decision model for the grader (optional, empty disables it)
            - name: TYPESAFE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent
                  key: typesafe_api_key
                  optional: true
            # A2A remediation service (optional)
            - name: REMEDIATION_AGENT_URL
              value: http://remediation-agent:8080
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
