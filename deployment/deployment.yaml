apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-agent
  labels:
    app: kubernetes-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-agent
  template:
    metadata:
      labels:
        app: kubernetes-agent
    spec:
      serviceAccountName: kubernetes-agent
      containers:
        - name: agent
          image: quay.io/kevindubois/kubernetes-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            # Analysis model configuration
            - name: ANALYSIS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent
                  key: analysis_api_key
                  optional: true
            - name: ANALYSIS_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent
                  key: analysis_base_url
                  optional: true
            - name: ANALYSIS_MODEL
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent
                  key: analysis_model
                  optional: true
            # Remediation model configuration
            - name: REMEDIATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent
                  key: remediation_api_key
                  optional: true
            - name: REMEDIATION_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent
                  key: remediation_base_url
                  optional: true
            - name: REMEDIATION_MODEL
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent
                  key: remediation_model
                  optional: true
            # GitHub Configuration
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent
                  key: github_token
            # Git Configuration
            - name: GIT_USERNAME
              value: "kubernetes-agent"
            - name: GIT_EMAIL
              value: "kubernetes-agent@csanchez.org"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /q/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
