# Test configuration
# Provides a dummy token so @ConfigProperty(name = "github.token") is satisfied in @QuarkusTest classes.
github.token=test-token

# Speed up @Retry in tests — no sleep between attempts
dev.kevindubois.rollout.agent.analysis.AnalysisService/analyze/Retry/delay=0
dev.kevindubois.rollout.agent.analysis.AnalysisService/analyze/Retry/jitter=0

# Disable the canary sample floor and the windowed second scrape —
# mocked metrics never grow and tests must not sleep
analysis.sample.min-requests=0
analysis.sample.window-seconds=0
