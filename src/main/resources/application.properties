# Kubernetes Agent Application Properties
quarkus.http.port=8080
quarkus.application.name=kubernetes-agent
quarkus.container-image.registry=quay.io
quarkus.container-image.group=kevindubois
quarkus.container-image.name=kubernetes-agent
quarkus.container-image.tag=latest

# A2A Agent Configuration
a2a.agent.url=http://localhost
a2a.agent.version=1.0.1

# Kubernetes Config - Enable secrets
%prod.quarkus.kubernetes-config.enabled=true
%prod.quarkus.kubernetes-config.secrets.enabled=true
%prod.quarkus.kubernetes-config.secrets=kubernetes-agent
%prod.quarkus.kubernetes.namespace=openshift-gitops

quarkus.podman.platform=linux/amd64


# Limit sequential tool calls per AI-service invocation (default is 10).
# The remediation agent should call at most 1 tool; 3 gives headroom for retries.
quarkus.langchain4j.ai-service.max-tool-executions=3

# LangChain4j Configuration — single OpenAI-compatible provider
# Works with any OpenAI-compatible endpoint (OpenAI, Gemini, LiteLLM, vLLM, etc.)
quarkus.langchain4j.chat-model.provider=openai

# Common OpenAI settings (inherited by all OpenAI configurations)
quarkus.langchain4j.openai.chat-model.temperature=0.3
quarkus.langchain4j.openai.chat-model.max-completion-tokens=8192
quarkus.langchain4j.openai.chat-model.top-p=0.5
quarkus.langchain4j.openai.chat-model.presence-penalty=0.0
quarkus.langchain4j.openai.chat-model.frequency-penalty=0.0
quarkus.langchain4j.openai.timeout=PT60S
quarkus.langchain4j.openai.max-retries=3
quarkus.langchain4j.openai.chat-model.response-format=json

# Named model configuration for RemediationAgent (@ModelName("remediation"))
quarkus.langchain4j.remediation.chat-model.provider=openai
quarkus.langchain4j.openai.remediation.api-key=${REMEDIATION_API_KEY:${ANALYSIS_API_KEY:not-set}}
quarkus.langchain4j.openai.remediation.base-url=${REMEDIATION_BASE_URL:${ANALYSIS_BASE_URL:https://api.openai.com/v1}}
quarkus.langchain4j.openai.remediation.chat-model.model-name=${REMEDIATION_MODEL:${ANALYSIS_MODEL:gpt-4o}}
quarkus.langchain4j.openai.remediation.chat-model.temperature=0.0
quarkus.langchain4j.openai.remediation.chat-model.max-completion-tokens=8192
quarkus.langchain4j.openai.remediation.chat-model.response-format=json
quarkus.langchain4j.openai.remediation.timeout=PT60S
quarkus.langchain4j.openai.remediation.max-retries=3
quarkus.langchain4j.openai.remediation.log-requests=true
quarkus.langchain4j.openai.remediation.log-responses=true

# Base API key and endpoint configuration
quarkus.langchain4j.openai.api-key=${ANALYSIS_API_KEY:not-set}
quarkus.langchain4j.openai.base-url=${ANALYSIS_BASE_URL:https://api.openai.com/v1}
quarkus.langchain4j.openai.chat-model.model-name=${ANALYSIS_MODEL:gpt-4o}

# Test profile
%test.quarkus.langchain4j.chat-model.provider=openai
%test.quarkus.langchain4j.openai.base-url=${ANALYSIS_BASE_URL:https://api.openai.com/v1}
%test.quarkus.langchain4j.openai.chat-model.model-name=${ANALYSIS_MODEL:gpt-4o}
%test.quarkus.langchain4j.openai.timeout=PT30S
%test.quarkus.langchain4j.openai.log-requests=false
%test.quarkus.langchain4j.openai.log-responses=false

# Logging
quarkus.log.level=INFO
quarkus.log.category."dev.langchain4j".level=WARN
quarkus.log.category."dev.kevindubois.rollout.agent".level=DEBUG
%dev.quarkus.log.category."dev.langchain4j.agentic".level=DEBUG
%dev.quarkus.log.category."dev.langchain4j.agentic.supervisor".level=DEBUG

# Enable CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# GitHub REST Client Configuration
quarkus.rest-client.github-api.url=https://api.github.com
quarkus.rest-client.github-api.scope=jakarta.inject.Singleton

# GitHub token — injected from env var in dev/test, from Vault KV in prod
# The Vault KV field "github_token" maps to this property via SmallRye Config normalisation.
github.token=${GITHUB_TOKEN:}

# Vault configuration (activated by adding "vault" to QUARKUS_PROFILE, e.g. prod,vault)
%vault.quarkus.vault.url=${VAULT_ADDR:http://vault.openshift-gitops.svc.cluster.local:8200}
%vault.quarkus.vault.authentication.kubernetes.role=kubernetes-agent
%vault.quarkus.vault.kv-secret-engine-mount-path=secret
%vault.quarkus.vault.secret-config-kv-path=argo-rollouts/kubernetes-agent
# When using Vault, disable reading secrets from the K8s Secret (it won't exist)
%vault.quarkus.kubernetes-config.secrets.enabled=false

# Console mode configuration
# Use -Drun.mode=console to run in console mode
