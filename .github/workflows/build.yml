name: Build and Push Container Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # Full "owner/repo" path, used only for docker/metadata-action's `images:`
  # input below (it needs the full path to compute correct tag references).
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw -B clean package -DskipTests

      - name: Run tests
        run: ./mvnw -B test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push container image
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          # Tag primarily with the full commit SHA (guaranteed unique and
          # immutable, unlike a branch name or "latest") so deployments can
          # pin to an exact, traceable build. The other tags computed by
          # docker/metadata-action (branch name, PR ref, semver, latest) are
          # kept as additional convenience tags on the same image.
          ADDITIONAL_TAGS=$(printf '%s' "$META_JSON" | jq -r '.["tag-names"] | join(",")')
          ./mvnw -B package \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=${{ github.event_name != 'pull_request' }} \
            -Dquarkus.container-image.registry=${{ env.REGISTRY }} \
            -Dquarkus.container-image.group=${{ github.repository_owner }} \
            -Dquarkus.container-image.name=kubernetes-agent \
            -Dquarkus.container-image.tag=${{ github.event.pull_request.head.sha || github.sha }} \
            -Dquarkus.container-image.additional-tags=${ADDITIONAL_TAGS} \
            -DskipTests

